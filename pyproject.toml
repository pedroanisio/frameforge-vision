[project]
name = "frameforge-vision"
# PACKAGE version — this wheel's own release line. It is NOT the FrameForge
# document-format version (`frameforge_api.HEAD_VERSION`, 2.8.x): this package
# reads pixels, and its releases follow its own detectors and API, not the
# document contract.
version = "1.1.0"
description = "Read pixels and report what is there — measurement, primitive fitting, and image→document proposals for FrameForge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pedro Anisio Silva", email = "pedroanisio@gmail.com" }]
keywords = ["frameforge", "computer-vision", "opencv", "vectorization", "image-measurement", "reverse-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
# numpy is the only unconditional dependency: the domain layer (coordinates,
# fitting, geometry) is pure array maths. Everything heavier is optional and
# imported lazily, so `pip install frameforge-vision` stays small and the
# detectors that need OpenCV degrade with a clear message rather than an
# ImportError at import time.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# The classical detector lane: region detection, vectorisation, measurement.
cv = ["opencv-python-headless>=4.9", "pillow>=10"]
# OCR-assisted text detection.
ocr = ["pytesseract>=0.3.10"]
# The document-EMITTING half. Measuring an image needs none of this; building a
# FrameForge document from the measurements needs the authoring SDK. Declared as
# an extra rather than a hard dependency because the reverse edge is lazy too —
# neither distribution hard-depends on the other, so there is no cycle.
author = ["frameforge-sdk>=1.0,<2"]
# One lazy call rasterises an SVG through the engine's cairo lane
# (infrastructure/regions.py); everything else needs only the SDK.
raster = ["frameforge>=2.8,<3"]
# The optional local VLM lane.
#
# `torchvision` is here for a reason worth stating, because nothing in this
# package imports it: transformers 5.x split image processors into `pil` and
# `torchvision` backends, and for Idefics3 — SmolVLM-256M, this lane's default
# model — BOTH generated classes declare `_backends = ["torchvision"]`. Without
# it every import succeeds, `available()` used to answer yes, and
# `AutoProcessor.from_pretrained` then raised "Could not load any image
# processor class ... Missing optional dependencies: torchvision". An extra that
# installs a lane which cannot run is not a lighter install, it is a broken one.
# `vlm.BACKEND_MODULES` probes this list; tests/test_vlm_backend.py pins the two
# together in both directions.
vlm = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.46",
    "pillow>=10",
    "accelerate>=0.30",
    "num2words>=0.5",
]

[project.urls]
Repository = "https://github.com/pedroanisio/frameforge-vision"
Issues = "https://github.com/pedroanisio/frameforge-vision/issues"

[dependency-groups]
dev = [
    # TOML backport for the pin gate, which reads pyproject.toml. stdlib
    # `tomllib` is 3.11+ while requires-python is >=3.10, so the guarded
    # `import tomllib / except: import tomli` fallback needs this to resolve.
    "tomli>=2 ; python_version < '3.11'",
    "mypy>=1.11",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "pytest>=8",
    "pytest-cov>=5",
    "pyyaml>=6",
    "ruff>=0.6",
]

# Nothing in the family is on PyPI yet, so the siblings resolve from their
# public repositories — NOT from `../frameforge`. A relative path here is not a
# local convenience: uv reads this table when another project resolves THIS one
# from git, and rewrites `path = "../x"` into `git+<this repo>#subdirectory=../x`,
# which cannot exist. Family rule: intra-family sources are git URLs, never paths.
# Point this block at an index to build against published wheels.
[tool.uv.sources]
frameforge = { git = "https://github.com/pedroanisio/frameforge" }
frameforge-sdk = { git = "https://github.com/pedroanisio/frameforge-sdk" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frameforge_vision"]

[tool.hatch.build.targets.sdist]
exclude = ["/.venv", "/dist", "/htmlcov", "/.pytest_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Gates what MATTERS today: pyflakes (undefined names, unused imports — this is
# what proves the extraction's import rewrite was clean) plus real pycodestyle
# errors. It passes.
select = ["E", "F", "W"]
ignore = [
    "E501",
    # `l` as a local in domain/geometry.py — pre-existing in the moved
    # tree; renaming a variable inside a geometry kernel during a MOVE is
    # exactly the kind of drive-by that hides a real change in the diff.
    "E741",
]

# DEFERRED, deliberately. This tree moved verbatim from the monorepo, and
# restyling it in the same change would make the extraction diff unreviewable —
# a move and a refactor must not share a commit. Turning these on is tracked
# follow-up work, in roughly this order:
#
#   B023   (15)  closure over a loop variable — a genuine bug class, in
#                infrastructure/refine.py and friends. Real work, needs tests.
#   RUF046 (35)  redundant int() casts — behaviour-adjacent, verify each.
#   UP035/UP037/UP045 (109)  typing modernisation — mechanical, safe.
#   RUF002 (29)  ambiguous unicode in docstrings — mostly intentional (×, ≈).
#
# `select` above is the floor, not the ambition.
