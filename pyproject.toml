[project]
name = "frameforge-vision"
# PACKAGE version — this wheel's own release line. It is NOT the FrameForge
# document-format version (`frameforge_api.HEAD_VERSION`, 2.8.x): this package
# reads pixels, and its releases follow its own detectors and API, not the
# document contract.
version = "1.0.0"
description = "Read pixels and report what is there — measurement, primitive fitting, and image→document proposals for FrameForge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pedro Anisio Silva", email = "pedroanisio@gmail.com" }]
keywords = ["frameforge", "computer-vision", "opencv", "vectorization", "image-measurement", "reverse-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
# numpy is the only unconditional dependency: the domain layer (coordinates,
# fitting, geometry) is pure array maths. Everything heavier is optional and
# imported lazily, so `pip install frameforge-vision` stays small and the
# detectors that need OpenCV degrade with a clear message rather than an
# ImportError at import time.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# The classical detector lane: region detection, vectorisation, measurement.
cv = ["opencv-python-headless>=4.9", "pillow>=10"]
# OCR-assisted text detection.
ocr = ["pytesseract>=0.3.10"]
# The document-EMITTING half. Measuring an image needs none of this; building a
# FrameForge document from the measurements needs the authoring SDK. Declared as
# an extra rather than a hard dependency because the reverse edge is lazy too —
# neither distribution hard-depends on the other, so there is no cycle.
author = ["frameforge>=2.8"]
# The optional local VLM lane.
vlm = ["torch>=2.2", "transformers>=4.46", "pillow>=10", "accelerate>=0.30", "num2words>=0.5"]

[project.urls]
Repository = "https://github.com/pedroanisio/frameforge-vision"
Issues = "https://github.com/pedroanisio/frameforge-vision/issues"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "pytest>=8",
    "pytest-cov>=5",
    "pyyaml>=6",
    "ruff>=0.6",
]

# Develop against the sibling checkout: `frameforge` is not on PyPI, and the
# `author` extra must resolve to the local engine while the split settles.
# Drop this block (or point it at an index) to build against a published wheel.
[tool.uv.sources]
frameforge = { path = "../frameforge", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frameforge_vision"]

[tool.hatch.build.targets.sdist]
exclude = ["/.venv", "/dist", "/htmlcov", "/.pytest_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Gates what MATTERS today: pyflakes (undefined names, unused imports — this is
# what proves the extraction's import rewrite was clean) plus real pycodestyle
# errors. It passes.
select = ["E", "F", "W"]
ignore = [
    "E501",
    # `l` as a local in domain/geometry.py — pre-existing in the moved
    # tree; renaming a variable inside a geometry kernel during a MOVE is
    # exactly the kind of drive-by that hides a real change in the diff.
    "E741",
]

# DEFERRED, deliberately. This tree moved verbatim from the monorepo, and
# restyling it in the same change would make the extraction diff unreviewable —
# a move and a refactor must not share a commit. Turning these on is tracked
# follow-up work, in roughly this order:
#
#   B023   (15)  closure over a loop variable — a genuine bug class, in
#                infrastructure/refine.py and friends. Real work, needs tests.
#   RUF046 (35)  redundant int() casts — behaviour-adjacent, verify each.
#   UP035/UP037/UP045 (109)  typing modernisation — mechanical, safe.
#   RUF002 (29)  ambiguous unicode in docstrings — mostly intentional (×, ≈).
#
# `select` above is the floor, not the ambition.
